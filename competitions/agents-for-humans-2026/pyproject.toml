[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wexspace-professional-agent-kernel"
version = "0.2.0"
requires-python = ">=3.10"
description = "Challenge-new durable professional execution kernel for Agents for Humans 2026"
dependencies = ["strands-agents[gemini]==1.54.0", "google-genai==2.22.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
wexspace-evidence = "wexspace_professional_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
