[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wexspace-iew-agentic-fleet"
version = "0.1.0"
description = "Governed agent fleet for synthetic industrial engineering workflows"
requires-python = ">=3.11"
dependencies = [
  "google-adk==2.8.0",
  "google-genai==2.20.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4"
]

[project.scripts]
wexspace-fleet = "wexspace.cli:main"
wexspace-adk = "wexspace.adk_fleet:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wexspace = ["agent_registry.json"]
