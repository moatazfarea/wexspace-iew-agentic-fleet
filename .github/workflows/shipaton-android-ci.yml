name: Shipaton Android CI

on:
  push:
    branches: [ "shipaton-2026-mobile" ]
    paths:
      - "mobile/shipaton2026/**"
      - ".github/workflows/shipaton-android-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/shipaton2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testSandboxDebugUnitTest --stacktrace

      - name: Build RevenueCat Test Store APK
        run: gradle :app:assembleSandboxDebug --stacktrace

      - name: Build Galaxy test APK
        run: gradle :app:assembleGalaxyDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wexspace-fielddesk-debug-apks
          path: mobile/shipaton2026/app/build/outputs/apk/**/*.apk
