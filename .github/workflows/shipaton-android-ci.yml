name: Shipaton Android CI

on:
  push:
    branches: [ "shipaton-2026-mobile" ]
    paths:
      - "mobile/shipaton2026/**"
      - ".github/workflows/shipaton-android-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/shipaton2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests
        run: gradle :app:testTestStoreDebugUnitTest --stacktrace
      - name: Build Test Store APK
        run: gradle :app:assembleTestStoreDebug --stacktrace
      - name: Build Galaxy test APK
        run: gradle :app:assembleGalaxyDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wexspace-fielddesk-debug-apks
          path: mobile/shipaton2026/app/build/outputs/apk/**/*.apk
