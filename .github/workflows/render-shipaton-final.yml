name: Render WEXSPACE Shipaton final film
on:
  push:
    branches: [shipaton-nextgen-20260930-r01]
    paths:
      - submission/render-shipaton-final.sh
      - .github/workflows/render-shipaton-final.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Install media runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render 115-second evidence-first film
        shell: bash
        run: bash submission/render-shipaton-final.sh
      - name: Persist final film
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/WEXSPACE_SHIPATON_NEXTGEN_R01.mp4 submission/WEXSPACE_SHIPATON_NEXTGEN_R01.sha256 submission/WEXSPACE_SHIPATON_NEXTGEN_R01.meta.json
          git commit -m "video: render WEXSPACE Shipaton Next Gen R01" || exit 0
          git push
