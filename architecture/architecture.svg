<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">WEXSPACE AI governed agent fleet architecture</title>
  <desc id="desc">Verified R07 path from the WEXSPACE governing agent through the IEW specialist, deterministic tool, SQLite state, independent verification, and human release. Google ADK with Gemini 3.7 Flash through Vertex AI and the Cloud Run deployment are verified.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3057d5"/></marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a56100"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#14213d}.sub{font:16px Arial,sans-serif;fill:#43506a}.box{fill:#f7f9ff;stroke:#3057d5;stroke-width:2}.agent{fill:#eef3ff;stroke:#3057d5;stroke-width:2}.control{fill:#ecfbf4;stroke:#16845b;stroke-width:2}.open{fill:#fff7e8;stroke:#a56100;stroke-width:2;stroke-dasharray:9 7}.txt{font:700 17px Arial,sans-serif;fill:#14213d;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#43506a;text-anchor:middle}.arrow{stroke:#3057d5;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#a56100;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#dasharrow)}.legend{font:14px Arial,sans-serif;fill:#43506a}
    </style>
  </defs>
  <rect width="1200" height="980" fill="#ffffff"/>
  <text x="600" y="45" class="title" text-anchor="middle">WEXSPACE AI — IEW Agentic Engineering Fleet</text>
  <text x="600" y="73" class="sub" text-anchor="middle">Solid = locally executed and verified · dashed amber = implemented/prepared but external qualification open</text>

  <rect x="430" y="100" width="340" height="65" rx="13" class="box"/>
  <text x="600" y="128" class="txt">User / human reviewer</text><text x="600" y="150" class="small">goal intake and attributable release</text>
  <path d="M600 165 L600 205" class="arrow"/>

  <rect x="430" y="205" width="340" height="65" rx="13" class="box"/>
  <text x="600" y="233" class="txt">FastAPI / CLI</text><text x="600" y="255" class="small">workflow, status, worker, review endpoints</text>
  <path d="M600 270 L600 310" class="arrow"/>

  <rect x="430" y="310" width="340" height="72" rx="13" class="agent"/>
  <text x="600" y="339" class="txt">WEXSPACE Governing Agent</text><text x="600" y="362" class="small">context · policy · validation · routing · state</text>
  <path d="M600 382 L600 422" class="arrow"/>

  <rect x="430" y="422" width="340" height="72" rx="13" class="agent"/>
  <text x="600" y="451" class="txt">IEW Engineering Specialist</text><text x="600" y="474" class="small">bounded deterministic-tool authority</text>
  <path d="M600 494 L600 534" class="arrow"/>

  <rect x="430" y="534" width="340" height="72" rx="13" class="control"/>
  <text x="600" y="563" class="txt">Hydraulic calculation tool</text><text x="600" y="586" class="small">Darcy–Weisbach + Swamee–Jain</text>
  <path d="M600 606 L600 646" class="arrow"/>

  <rect x="430" y="646" width="340" height="72" rx="13" class="control"/>
  <text x="600" y="675" class="txt">SQLite state + event audit</text><text x="600" y="698" class="small">persistent workflow ID · restart/resume · hashes</text>
  <path d="M600 718 L600 758" class="arrow"/>

  <rect x="430" y="758" width="340" height="72" rx="13" class="agent"/>
  <text x="600" y="787" class="txt">WEXSPACE Verification / Evidence</text><text x="600" y="810" class="small">independent Haaland recomputation</text>
  <path d="M600 830 L600 870" class="arrow"/>

  <rect x="430" y="870" width="340" height="72" rx="13" class="control"/>
  <text x="600" y="899" class="txt">Human review gate</text><text x="600" y="922" class="small">approval required before RELEASED</text>

  <rect x="35" y="250" width="305" height="95" rx="13" class="open"/>
  <text x="188" y="280" class="txt">Google ADK + Gemini 3.7</text><text x="188" y="303" class="small">Vertex AI + ADC</text><text x="188" y="326" class="small">deployed trace: PASS</text>
  <path d="M340 298 L425 337" class="dash"/>

  <rect x="860" y="205" width="305" height="95" rx="13" class="open"/>
  <text x="1013" y="235" class="txt">Google Cloud Run</text><text x="1013" y="258" class="small">revision 00002-9tw</text><text x="1013" y="281" class="small">DEPLOYED / INVOKED / VERIFIED</text>
  <path d="M860 252 L775 240" class="dash"/>

  <rect x="35" y="390" width="305" height="115" rx="13" class="control"/>
  <text x="188" y="420" class="txt">Versioned agent registry</text><text x="188" y="444" class="small">tools · data · actions</text><text x="188" y="467" class="small">prohibited actions · cards</text><text x="188" y="490" class="small">PUBLIC_SAFE_SYNTHETIC_ONLY</text>
  <path d="M340 448 L425 370" class="arrow"/>

  <text x="825" y="790" class="legend">Verified result includes calculation, independent validation, provenance hashes,</text>
  <text x="825" y="812" class="legend">timestamped routing/tool/state events, and an attributable review decision.</text>
</svg>
