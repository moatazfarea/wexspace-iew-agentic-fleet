  <path d="M1005 309 L905 238" class="blue"/>

  <rect x="1005" y="470" width="350" height="105" rx="13" class="control"/>
  <text x="1180" y="500" class="txt">Synthetic UTL-NET-001 data</text><text x="1180" y="525" class="small">explicit parameters · no employer/customer data</text><text x="1180" y="553" class="tag pass">PUBLIC-SAFE FIXTURE</text>
  <path d="M1005 523 L905 523" class="blue"/>

  <rect x="1005" y="700" width="350" height="120" rx="13" class="future"/>
  <text x="1180" y="730" class="txt">Managed enterprise services</text><text x="1180" y="755" class="small">Agent Runtime · Memory Bank · Identity</text><text x="1180" y="779" class="small">Gateway · Model Armor · Observability</text><text x="1180" y="806" class="tag" fill="#7a808b">RECOMMENDED / NOT IMPLEMENTED</text>

  <line x1="80" y1="1110" x2="130" y2="1110" class="blue"/><text x="145" y="1115" class="legend">solid: executed and verified application/evidence path</text>
  <line x1="535" y1="1110" x2="585" y2="1110" class="amber"/><text x="600" y="1115" class="legend">dashed amber: external dependency not yet verified</text>
  <rect x="1070" y="1095" width="40" height="25" class="future"/><text x="1125" y="1115" class="legend">future / not implemented</text>
</svg>
