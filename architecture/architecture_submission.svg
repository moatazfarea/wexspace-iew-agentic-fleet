  <path d="M700 257 L700 288" class="blue"/>

  <rect x="500" y="288" width="400" height="70" rx="13" class="control"/>
  <text x="700" y="317" class="txt">Context / scope / authority control</text><text x="700" y="341" class="small">allowlist · input completeness · injection checks</text>
  <path d="M700 358 L700 389" class="blue"/>

  <rect x="500" y="389" width="400" height="70" rx="13" class="agent"/>
  <text x="700" y="418" class="txt">IEW Engineering Specialist</text><text x="700" y="442" class="small">bounded engineering-tool delegation</text>
  <path d="M700 459 L700 490" class="blue"/>

  <rect x="500" y="490" width="400" height="70" rx="13" class="control"/>
  <text x="700" y="519" class="txt">Deterministic hydraulic tool</text><text x="700" y="543" class="small">Darcy–Weisbach + Swamee–Jain</text>
  <path d="M700 560 L700 591" class="blue"/>

  <rect x="500" y="591" width="400" height="70" rx="13" class="control"/>
  <text x="700" y="620" class="txt">Persistent workflow state</text><text x="700" y="644" class="small">SQLite · workflow ID · restart/resume · bounded worker</text>
  <path d="M700 661 L700 692" class="blue"/>

  <rect x="500" y="692" width="400" height="70" rx="13" class="agent"/>
  <text x="700" y="721" class="txt">WEXSPACE Verification / Evidence Specialist</text><text x="700" y="745" class="small">independent Haaland recomputation + acceptance checks</text>
  <path d="M700 762 L700 793" class="blue"/>

