  <path d="M395 344 L495 326" class="blue"/>

  <rect x="45" y="775" width="350" height="105" rx="13" class="evidence"/>
  <text x="220" y="805" class="txt">Google Drive evidence plane</text><text x="220" y="830" class="small">portable checkpoints · raw readback · SHA-256</text><text x="220" y="858" class="tag pass">VERIFIED CONTINUITY, NOT RUNTIME STATE</text>
  <path d="M395 828 L495 828" class="blue"/>

  <rect x="1005" y="105" width="350" height="105" rx="13" class="control"/>
  <text x="1180" y="135" class="txt">Google Cloud Run</text><text x="1180" y="160" class="small">us-central1 · revision 00002-9tw</text><text x="1180" y="185" class="small">deployment + invocation + logs: PASS</text>
