<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
  <title id="title">WEXSPACE AI — IEW Agentic Engineering Fleet architecture</title>
  <desc id="desc">The verified application path runs from the user through the WEXSPACE governing agent, context and authority control, IEW specialist, deterministic tool, persistent state, independent verification, audit and provenance, human review, and verified result. Google ADK with Gemini 3.7 Flash through Vertex AI and the Cloud Run deployment are verified.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2855d9"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a86100"/></marker>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#14213d}.subtitle{font:16px Arial,sans-serif;fill:#43506a}.box{fill:#f8faff;stroke:#2855d9;stroke-width:2.2}.agent{fill:#eaf0ff;stroke:#2855d9;stroke-width:2.4}.control{fill:#eaf9f2;stroke:#16845b;stroke-width:2.2}.evidence{fill:#f1edff;stroke:#7047b8;stroke-width:2.2}.external{fill:#fff6e4;stroke:#a86100;stroke-width:2.2;stroke-dasharray:9 7}.future{fill:#f2f3f6;stroke:#7a808b;stroke-width:1.8;stroke-dasharray:5 6}.txt{font:700 17px Arial,sans-serif;fill:#14213d;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#43506a;text-anchor:middle}.blue{stroke:#2855d9;stroke-width:2.5;fill:none;marker-end:url(#blueArrow)}.amber{stroke:#a86100;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#amberArrow)}.legend{font:14px Arial,sans-serif;fill:#43506a}.tag{font:700 13px Arial,sans-serif;text-anchor:middle}.pass{fill:#16845b}.openText{fill:#a86100}
    </style>
  </defs>
  <rect width="1400" height="1160" fill="#ffffff"/>
  <text x="700" y="42" class="title" text-anchor="middle">WEXSPACE AI — IEW Agentic Engineering Fleet</text>
  <text x="700" y="70" class="subtitle" text-anchor="middle">Fortified Enterprise Fleet · implemented path and evidence boundaries</text>

  <rect x="500" y="92" width="400" height="64" rx="13" class="box"/>
  <text x="700" y="120" class="txt">User / accountable reviewer</text><text x="700" y="143" class="small">professional goal + attributable release authority</text>
  <path d="M700 156 L700 187" class="blue"/>

